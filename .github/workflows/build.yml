name: Build

on:
  pull_request:
    branches:
      - design-system

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/eventhelm-admin/package-lock.json
      - name: Build .NET backend
        run: dotnet build backend/EventHelm.Api/EventHelm.Api.csproj --configuration Release
      - name: Install frontend dependencies
        working-directory: frontend/eventhelm-admin
        run: npm ci
      - name: Build frontend
        working-directory: frontend/eventhelm-admin
        run: npm run build
